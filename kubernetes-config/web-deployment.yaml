apiVersion: apps/v1
kind: Deployment
metadata:
 labels:
   app: events-web
 name: events-web
spec:
 replicas: 3
 selector:
   matchLabels:
     app: events-web
     ver: v2
 template:
   metadata:
     labels:
       app: events-web
       ver: v2
   spec:
     containers:
     - image: 271271282869.dkr.ecr.us-east-1.amazonaws.com/events-website:v2
       name: events-web
       ports:
       - containerPort: 8080
       env:
       - name: SERVER
         value: "http://events-api-svc:8082"